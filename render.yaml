# Render Blueprint — Eternal Beam FastAPI (Docker)
# Dashboard: New → Blueprint → GitHub repo 연결 → Apply
services:
  - type: web
    name: eternal-beam-video-api
    region: singapore
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PUBLIC_API_BASE_URL
        value: https://eternal-beam-video-api.onrender.com
      - key: HYBRID_USE_SUPABASE
        value: "1"
      - key: PET_HYBRID_SEED
        value: "0"
      - key: PET_BATCH_USE_SUPABASE
        value: "1"
      - key: CREDIT_COST_PER_PLACE
        value: "4"
      - key: LUMA_CREDIT_CONCURRENCY
        value: "3"
      - key: SUPABASE_STORAGE_BUCKET
        value: user-assets
      # 아래는 Render 대시보드에서 직접 입력 (Blueprint 적용 후 Environment 탭)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LUMA_API_KEY
        sync: false
