# Render Blueprint — FastAPI 누끼 API (Docker)
# Dashboard → Blueprint → 이 repo 연결
services:
  - type: web
    name: eternal-beam-video-api
    region: singapore
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PUBLIC_API_BASE_URL
        value: https://eternal-beam-video-api.onrender.com
      - key: HYBRID_USE_SUPABASE
        value: "1"
      - key: PET_HYBRID_SEED
        value: "0"
      - key: CREDIT_COST_PER_PLACE
        value: "4"
      - key: LUMA_CREDIT_CONCURRENCY
        value: "3"
