# Render Blueprint — Eternal Beam FastAPI (Docker)
# Dashboard: New → Blueprint → GitHub repo 연결 → Apply
services:
  - type: web
    name: eternal-beam-video-api
    region: singapore
    plan: starter
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PUBLIC_API_BASE_URL
        value: https://eternal-beam-video-api.onrender.com
      - key: HYBRID_USE_SUPABASE
        value: "1"
      - key: PET_HYBRID_SEED
        value: "0"
      - key: PET_BATCH_USE_SUPABASE
        value: "1"
      # Limited Business QA cohort. The two allowlist values must be entered
      # identically on web and worker before the cohort is enabled.
      - key: BUSINESS_QA_USER_TEST_MODE
        value: allowlist
      - key: BUSINESS_QA_USER_TEST_PET_IDS
        sync: false
      - key: PHASE6_LIVE_MODE
        value: allowlist
      - key: PHASE6_LIVE_ALLOWLIST
        sync: false
      - key: BUSINESS_QA_SHADOW_TELEMETRY
        value: "1"
      - key: PET_VLM_IDENTITY_ENABLED
        value: "1"
      - key: CREDIT_COST_PER_PLACE
        value: "4"
      - key: STARTER_CREDITS
        value: "4"
      - key: PAYMENT_MOCK
        value: "1"
      - key: SUBSCRIPTION_MOCK
        value: "1"
      # ── 웹 정기결제 (Toss) ───────────────────────────────────────────────
      # 값은 대시보드에서 넣는다(sync:false) — 시크릿을 저장소에 커밋하지 않는다.
      - key: TOSS_CLIENT_KEY      # 공개 키 (test_ck_ / live_ck_)
        sync: false
      - key: TOSS_SECRET_KEY      # ⚠️ 백엔드 전용 (test_sk_ / live_sk_)
        sync: false
      - key: BILLING_CRON_SECRET  # 갱신 배치 인증. 미설정이면 renew-due 는 503
        sync: false
      # ── 일회성 테마 가격 (KRW, 서버가 유일한 권위) ───────────────────────
      - key: THEME_PRICE_AURORA_KRW
        value: "4900"
      - key: THEME_PRICE_SUNSET_KRW
        value: "4900"
      - key: THEME_PRICE_OCEAN_DEEP_KRW
        value: "4900"
      - key: THEME_PRICE_CUSTOM_PHOTO_BG_KRW
        value: "4900"

      # ── Soul Trace 핸드오프 (Phase 10.5) ──────────────────────────────────
      # Soul Trace 는 **다른 Supabase 프로젝트**다. 교차 DB 조회를 하지 않고,
      # 서로의 service-role 키도 공유하지 않는다. 공유 비밀은 이 토큰 하나뿐이며,
      # 편지 본문은 이 자격 증명으로 **서버 대 서버**로만 이동한다.
      - key: SOUL_TRACE_API_BASE
        value: https://soultrace.eternalbeam.com
      # ── 인쇄 생산 (Phase 13/14) ───────────────────────────────────────────
      # 인쇄되는 QR 이 가리킬 **웹앱** 도메인. 미설정이면 인쇄용 QR 생성이
      # 거절된다(fail closed) — API 도메인이나 localhost 를 찍은 카드가
      # 인쇄되는 것보다 만들지 않는 편이 낫다.
      - key: PUBLIC_WEB_BASE_URL
        value: https://device.eternalbeam.com
      # 한글 A5 편지 PDF에 **임베드**할 라이선스 TTF 경로.
      # ⚠️ 폰트 파일은 저장소에 넣지 않는다(라이선스). 이미지에 함께 넣거나
      #    디스크에 두고 경로만 지정한다. 미설정이면 내장 CID 폰트로 렌더되는데
      #    그것은 **임베드되지 않아** 인쇄소에서 글자가 깨질 수 있다.
      - key: PRINT_LETTER_FONT_PATH
        sync: false
      # 언어별 인쇄 폰트 — Soul Trace 최종 화면과 **같은 글꼴**로 찍기 위한 것.
      #   ko: .font-ko        → "Noto Serif KR", "Nanum Myeongjo"
      #   en: .font-display-en → "Marcellus"
      # 원격 Google Fonts 를 쓰지 않는다. 자세한 규약은 backend/fonts/README.md.
      # 미설정이면 내장 CID 로 떨어지고 **임베드되지 않는다**(인쇄소에서 대체될 수 있다).
      - key: PRINT_LETTER_FONT_KO_PATH
        sync: false
      - key: PRINT_LETTER_FONT_KO_FALLBACK_PATH
        sync: false
      - key: PRINT_LETTER_FONT_EN_PATH
        sync: false
      # ⚠️ 백엔드 전용. 브라우저에 노출되면 Soul Trace 내부 API 가 열린다.
      - key: SOUL_TRACE_SERVICE_TOKEN
        sync: false
      # 프로바이더 중립 생성 차단. 실 생성을 켜기 전까지 1 로 둔다.
      - key: GENERATION_MOCK
        value: "1"
      - key: LUMA_CREDIT_CONCURRENCY
        value: "3"
      - key: SUPABASE_STORAGE_BUCKET
        value: user-assets
      # 아이들(Idle) 영상 목업 테스트 — 실제 Luma 과금 없이 파이프라인만 확인.
      # 진짜 생성으로 바꾸려면 LUMA_MOCK 삭제 + 아래 LUMA_API_KEY 채우기.
      - key: ENABLE_GENERATE_API
        value: "1"
      # /api/generate-idle-variant 는 **닫아 둔다.**
      #
      # 이 경로는 아직 scene_generation_jobs 예약을 쓰지 않아 provider_job_id 를
      # 남기지 않는다. 동기식이라 타임아웃·새로고침·502 재시도가 각각 새 유료
      # 작업이 되고, 되찾을 방법이 없다 — /generate-pet-video 가 고치기 전에
      # 갖고 있던 노출과 같다.
      #
      # ENABLE_GENERATE_API 로는 대신 끌 수 없다: 보호가 끝난 BREATHING
      # (/generate-pet-video)이 같은 라우터에 있어 함께 꺼진다.
      #
      # 예약 + 복구 폴링이 붙으면 이 항목과 라우터의 가드를 함께 제거한다.
      - key: ENABLE_IDLE_VARIANT_API
        value: "0"
      - key: LUMA_MOCK
        value: "1"
      - key: MOCK_LUMA_USE_KEYFRAME
        value: "1"
      - key: MOCK_LUMA_VIDEO_URL
        value: https://eternal-beam-app.vercel.app/demo/goya_idle_packed.mp4
      # 아래는 Render 대시보드에서 직접 입력 (Blueprint 적용 후 Environment 탭)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RUNWAY_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: SEEDANCE_API_KEY
        sync: false
      - key: ARK_API_KEY
        sync: false
      - key: KLING_ACCESS_KEY
        sync: false
      - key: KLING_SECRET_KEY
        sync: false
      - key: LUMA_API_KEY
        sync: false

  # ── 생성 워커 (Phase 7D) ────────────────────────────────────────────────
  # pet_generation_runs 를 폴링/전진시키는 상주 프로세스. 웹 서비스는 이 워커를
  # 절대 기동하지 않는다(backend/main.py lifespan 은 이를 참조하지 않는다) —
  # 웹이 죽거나 재배포돼도 생성은 멈추지 않고, 반대로 이 워커가 죽어도 웹은
  # 영향받지 않는다. `type: worker` 는 Render 가 크래시/배포 후 자동 재시작한다.
  #
  # dockerCommand 에서 `exec` 를 쓰는 이유: `sh -c "python ..."` 로만 실행하면
  # sh 가 PID 1 이 되어 Render 가 보내는 SIGTERM 을 자식(python)에게 전달하지
  # 않는 셸이 있다 — 그러면 lease 를 정리할 기회 없이 강제 SIGKILL 로 죽는다.
  # `exec` 는 python 프로세스가 sh 를 대체(PID 1)하게 해 SIGTERM 을 직접
  # 받게 하고, 워커가 현재 tick 을 마친 뒤 새 run 을 더 이상 점유하지 않고
  # 깔끔히 멈추게 한다. 강제 종료(SIGKILL)로 중간에 죽더라도 점유 중이던
  # run 은 execution_token 으로 펜싱된 lease 라서 다른 워커가 함부로 가로채지
  # 못하고, GENERATION_RUN_LEASE_SECONDS 후 자동 만료되어 안전하게 재점유된다
  # (claim_next_pet_generation_run, supabase/migrations/20261019000000_*.sql).
  - type: worker
    name: eternal-beam-generation-worker
    region: singapore
    plan: standard
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: exec python -m backend.workers.pet_generation_worker
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # 워커 전용 설정 — 웹 서비스에는 절대 넣지 않는다(넣으면 웹 프로세스
      # 안에서 두 번째 폴링 루프가 돌아 이 블루프린트가 고치려는 문제,
      # 곧 "웹 재시작/스케일과 생성 폴링이 얽히는 상태"가 되돌아온다).
      - key: PET_GENERATION_WORKER_ENABLED
        value: "1"
      - key: PET_GENERATION_WORKER_POLL_SEC
        value: "10"
      - key: PET_GENERATION_WORKER_LOG_LEVEL
        value: "INFO"
      - key: GENERATION_RUN_LEASE_SECONDS
        value: "300"
      # ── 누끼(SAM2/ViTMatte) 메모리 상한 (OOM 최적화 3단계, 워커 전용) ──
      # 2GB 워커 안에서 CPU 추론의 스레드 풀·malloc 아레나가 RSS 를 키우지
      # 않게 한다. OMP/MKL 스레드 1 = oneDNN/BLAS 가 스레드별 스크래치를
      # 여러 벌 잡지 않는다(torch.set_num_threads(1) 과 짝, vitmatte_service).
      # MALLOC_ARENA_MAX=2 = glibc 가 스레드마다 별도 힙 아레나를 늘려 반환
      # 안 된 메모리를 쌓아 두지 않게 한다. 웹 서비스에는 넣지 않는다 —
      # 요청 동시성이 있는 프로세스라 별도 판단이 필요하다.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      # BREATHING/Phase 6-7 모션 생성(video_motion_providers.live_generation_
      # allowed(), motion_video_service.py 가 호출)의 실 프로바이더 대량 과금
      # 게이트. GENERATION_MOCK(아래)과는 별개 스위치 — GENERATION_MOCK 은
      # video_generation.py 의 구(WAN/Luma) 파이프라인만 막고 이 게이트에는
      # 아무 영향이 없다. 이 값이 없으면(기본 off) MOTION_GENERATION 단계가
      # 항상 LIVE_GENERATION_BLOCKED(403)로 실패한다. Limited cohort 에서는
      # Business QA cohort 와 동일한 pet allowlist 만 허용한다.
      # 정본/키프레임 이미지(CANONICAL_GENERATION_MOCK/KEYFRAME_GENERATION_
      # MOCK, canonical_image_providers.py)는 이 값과 무관하게 별도 스위치이고
      # 여기 없으므로 기본값(0=실 생성)으로 남는다 — 배포 전 그것이 의도한
      # 상태인지 반드시 별도로 확인한다.
      - key: PHASE6_LIVE_MODE
        value: allowlist
      - key: PHASE6_LIVE_ALLOWLIST
        sync: false
      - key: BUSINESS_QA_USER_TEST_MODE
        value: allowlist
      - key: BUSINESS_QA_USER_TEST_PET_IDS
        sync: false
      - key: BUSINESS_QA_SHADOW_TELEMETRY
        value: "1"
      - key: PET_VLM_IDENTITY_ENABLED
        value: "1"
      - key: MOTION_DELIVERY_MATTE_BACKEND
        value: "vitmatte"
      # 아래부터는 웹 서비스와 동일하게 맞춘 생성 파이프라인 설정.
      # 값이 갈라지면(예: 한쪽만 GENERATION_MOCK=1) 웹이 큐에 넣은 run 을
      # 워커가 다른 프로바이더 모드로 처리해버리는 불일치가 생긴다 — 값을
      # 바꿀 때는 web 서비스와 이 워커 서비스 둘 다 같이 바꾼다.
      - key: HYBRID_USE_SUPABASE
        value: "1"
      - key: PET_HYBRID_SEED
        value: "0"
      - key: PET_BATCH_USE_SUPABASE
        value: "1"
      - key: GENERATION_MOCK
        value: "1"
      - key: LUMA_CREDIT_CONCURRENCY
        value: "3"
      - key: SUPABASE_STORAGE_BUCKET
        value: user-assets
      - key: LUMA_MOCK
        value: "1"
      - key: MOCK_LUMA_USE_KEYFRAME
        value: "1"
      - key: MOCK_LUMA_VIDEO_URL
        value: https://eternal-beam-app.vercel.app/demo/goya_idle_packed.mp4
      # 웹 서비스와 값을 "공유"하되, Render sync:false 는 서비스별로 각각
      # 입력해야 한다(자동 동기화되지 않는다) — Blueprint 적용 후
      # Environment 탭에서 web 서비스와 동일한 값을 이 워커 서비스에도 넣는다.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RUNWAY_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: SEEDANCE_API_KEY
        sync: false
      - key: ARK_API_KEY
        sync: false
      - key: KLING_ACCESS_KEY
        sync: false
      - key: KLING_SECRET_KEY
        sync: false
      - key: LUMA_API_KEY
        sync: false

