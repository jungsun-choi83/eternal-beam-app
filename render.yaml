# Render Blueprint — Eternal Beam FastAPI (Docker)
# Dashboard: New → Blueprint → GitHub repo 연결 → Apply
services:
  - type: web
    name: eternal-beam-video-api
    region: singapore
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PUBLIC_API_BASE_URL
        value: https://eternal-beam-video-api.onrender.com
      - key: HYBRID_USE_SUPABASE
        value: "1"
      - key: PET_HYBRID_SEED
        value: "0"
      - key: PET_BATCH_USE_SUPABASE
        value: "1"
      - key: CREDIT_COST_PER_PLACE
        value: "4"
      - key: STARTER_CREDITS
        value: "4"
      - key: PAYMENT_MOCK
        value: "1"
      - key: SUBSCRIPTION_MOCK
        value: "1"
      - key: LUMA_CREDIT_CONCURRENCY
        value: "3"
      - key: SUPABASE_STORAGE_BUCKET
        value: user-assets
      # 아이들(Idle) 영상 목업 테스트 — 실제 Luma 과금 없이 파이프라인만 확인.
      # 진짜 생성으로 바꾸려면 LUMA_MOCK 삭제 + 아래 LUMA_API_KEY 채우기.
      - key: ENABLE_GENERATE_API
        value: "1"
      - key: LUMA_MOCK
        value: "1"
      - key: MOCK_LUMA_VIDEO_URL
        value: https://eternal-beam-app.vercel.app/demo/goya_idle_packed.mp4
      # 아래는 Render 대시보드에서 직접 입력 (Blueprint 적용 후 Environment 탭)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LUMA_API_KEY
        sync: false
